name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        # Functional gate only - timing-sensitive tests are marked
        # 'benchmark' and excluded (see pyproject [tool.pytest.ini_options]).
        run: uv run pytest -q -m "not benchmark"
  benchmark:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv sync
      - name: Run bilingual benchmark
        run: |
          uv run python -m evals.benchmark_bilingual
      - name: Run cross-domain benchmark
        run: |
          uv run python -m evals.benchmark
