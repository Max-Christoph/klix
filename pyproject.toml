[project]
name = "klix-engine"
version = "0.11.0"
description = "Decoupled decision heads (Choice, MultiLabel, Score, Flag) on a shared semantic backbone - local, deterministic, no model training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Max-Christoph Hähnel", email = "m-c-haehnel@gmx.de" }
]
keywords = ["nlp", "decision-engine", "embeddings", "classification", "routing", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
]
dependencies = [
    "fastembed>=0.3,<1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/Max-Christoph/klix"
Repository = "https://github.com/Max-Christoph/klix"
Issues = "https://github.com/Max-Christoph/klix/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
    # Schemas are validated against the real JSON-Schema file in the test suite.
    # Test-only: the runtime package still imports nothing beyond its three deps.
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klix"]
# Ship the bundled glossary JSON files (Hatchling includes only .py by default).
# - glossary.json          : the original 16-term manufacturing production pack
# - data/default_glossary.json : the broad DE<->EN basic vocabulary (v0.9.0),
#                                generated by scripts/build_default_glossary.py
artifacts = [
    "src/klix/glossary.json",
    # Curated tri-domain glossary (362 concepts, original work, MIT) + domain map.
    "src/klix/data/curated_glossary.json",
    "src/klix/data/curated_domains.json",
    # The documented format (JSON Schema), shipped so a user can author/validate
    # their own glossary without reading klix's source.
    "src/klix/data/glossary.schema.json",
    # Opt-in broad vocabulary (CC0/Wikidata) with its build provenance.
    "src/klix/data/default_glossary.json",
    "src/klix/data/build_meta.json",
    # Multilingual core: 25 concepts x 10 ISO-639-1 languages (hand-written, MIT).
    "src/klix/data/multilingual_core.json",
    # Function-word corpus per language: trains klix.langid's profiles. NOT a
    # glossary pack (see the note in klix/glossaries.py).
    "src/klix/data/langid_corpus.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can import the evals/ harness (not shipped).
pythonpath = ["."]
# Functional tests are the CI gate; timing-sensitive cases are excluded
# by default and run explicitly via `-m benchmark` (see README "Development").
markers = [
    "benchmark: timing-sensitive tests (head latency, batch throughput) - excluded from CI gate",
]
addopts = "-m 'not benchmark'"