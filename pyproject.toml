[project]
name = "klix-engine"
version = "0.6.0"
description = "Decoupled decision heads (Choice, Score, Flag) on a shared semantic backbone - local, deterministic, no model training."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Max-Christoph Hähnel", email = "m-c-haehnel@gmx.de" }
]
keywords = ["nlp", "decision-engine", "embeddings", "classification", "routing", "semantic-search"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Natural Language :: English",
]
dependencies = [
    "fastembed>=0.3,<1",
    "numpy>=1.24",
    "scikit-learn>=1.3",
]

[project.urls]
Homepage = "https://github.com/Max-Christoph/klix"
Repository = "https://github.com/Max-Christoph/klix"
Issues = "https://github.com/Max-Christoph/klix/issues"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klix"]

[tool.pytest.ini_options]
testpaths = ["tests"]